# Prüft jeden Push auf main und jeden Pull Request: Lint, Typen, Migrationen, Tests und Produktions-Build.
# Die Tests laufen gegen eine frische PostgreSQL-Datenbank, auf die alle Migrationen von Null an angewendet werden.
# Damit fallen auch kaputte Migrationen und fehlende Trigger auf, bevor Coolify sie auf dem Server ausführt.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push bricht den noch laufenden Lauf desselben Branches ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    # Gegen echtes PostgreSQL dauert die Suite rund 6 bis 10 Minuten (über 590 Integrationstests).
    # Das Limit fängt nur echte Hänger ab; einzelne Tests haben zusätzlich ein eigenes Limit (siehe Schritt Tests).
    timeout-minutes: 45

    services:
      postgres:
        # Dieselbe PostgreSQL-Version wie die Produktionsdatenbank (rent-base-db, postgres:18-alpine, Stand 09.10.2026: 18.6).
        # Abweichung: Produktion nutzt ein älteres Alpine-Build desselben Releases (Digest sha256:d3e1620b…);
        # dieser Tag zeigt auf den aktuellen Neubau (sha256:d8703cd7…). PostgreSQL selbst ist identisch.
        # Nach einem PostgreSQL-Update in Coolify hier mitziehen.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Nur für diesen Lauf, die Datenbank existiert ausschließlich im CI-Container.
      # connection_limit=5 wie in Produktion: Dort steht kein Parameter in der URL, Prisma nimmt 2 × vCPUs + 1 = 5.
      # So laufen gleichzeitige Zugriffe in den Tests wirklich parallel, wie bei echten Nutzern.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rentbase?connection_limit=5
      # psql versteht Prisma-Parameter wie connection_limit nicht und bekommt deshalb eine eigene Adresse
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/rentbase
      SHADOW_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rentbase_shadow
      NEXT_TELEMETRY_DISABLED: 1
      # Wie im Produktions-Image (Dockerfile): Kalendertage und Zeitangaben in deutscher Zeit
      TZ: Europe/Berlin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # wie im Dockerfile
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client erzeugen
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typprüfung
        run: npm run typecheck

      - name: Migrationen auf leere Datenbank anwenden
        run: npx prisma migrate deploy

      - name: schema.prisma passt zu den Migrationen
        # Schlägt fehl, wenn das Schema geändert wurde, ohne eine Migration anzulegen
        run: |
          psql "$PG_ADMIN_URL" -c "CREATE DATABASE rentbase_shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Tests
        id: tests
        # Kein Test wird übersprungen. Jeder einzelne Test scheitert nach 2 Minuten mit seinem Namen, statt zu hängen
        # (--test-timeout); offene Verbindungen verhindern das Beenden nicht (--test-force-exit). Siehe package.json test:ci.
        timeout-minutes: 30
        run: npm run test:ci

      - name: Fehlerübersicht
        # Gescheiterte Tests mit Datei und Meldung in der Zusammenfassung des Laufs, ohne das ganze Log lesen zu müssen
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node .github/scripts/test-summary.mjs test-results.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Build-Cache von Next.js
        # Build auch prüfen, wenn Tests scheitern: Ein Build-Fehler soll nicht hinter Testfehlern verborgen bleiben
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Produktions-Build
        if: ${{ !cancelled() }}
        run: npm run build
